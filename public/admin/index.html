<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Impede que o Google indexe o painel -->
    <meta name="robots" content="noindex" />
    <title>Painel | Cristopher Lima</title>
    <!-- Carrega o Sveltia CMS; ele lê o config.yml desta mesma pasta -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

    <!--
      Componente "Código com linguagem".
      O bloco de código nativo do Sveltia não deixa escolher a linguagem,
      então criamos um componente próprio: um menu com a linguagem + a caixa do código.
      Ele grava o bloco no formato padrão do Markdown:  ```sql ... ```
    -->
    <script type="module">
      const linguagens = [
        { label: 'SQL', value: 'sql' },
        { label: 'C#', value: 'csharp' },
        { label: 'Python', value: 'python' },
        { label: 'JavaScript', value: 'javascript' },
        { label: 'TypeScript', value: 'typescript' },
        { label: 'Dart / Flutter', value: 'dart' },
        { label: 'Go', value: 'go' },
        { label: 'PowerShell', value: 'powershell' },
        { label: 'Bash / Terminal', value: 'bash' },
        { label: 'CMD / Batch', value: 'bat' },
        { label: 'JSON', value: 'json' },
        { label: 'YAML', value: 'yaml' },
        { label: 'XML', value: 'xml' },
        { label: 'HTML', value: 'html' },
        { label: 'CSS', value: 'css' },
        { label: 'Astro', value: 'astro' },
        { label: 'Markdown', value: 'markdown' },
        { label: 'Texto simples', value: 'text' },
      ];

      window.CMS.registerEditorComponent({
        id: 'codigo',
        label: 'Código',
        icon: 'code_blocks',
        trigger: 'button',
        fields: [
          { name: 'lang', label: 'Linguagem', widget: 'select', options: linguagens, default: 'sql' },
          { name: 'code', label: 'Código', widget: 'text' },
        ],
        // Reconhece blocos já existentes no texto: ```linguagem (quebra) código (quebra) ```
        pattern: /^```([\w#+-]*)\n([\s\S]*?)\n```$/m,
        fromBlock: (match) => ({ lang: match[1] || 'text', code: match[2] }),
        // Gera o Markdown que vai para o arquivo .md
        toBlock: ({ lang = 'text', code = '' } = {}) => '```' + lang + '\n' + code + '\n```',
        // Como o bloco aparece na pré-visualização do painel
        toPreview: ({ lang = 'text', code = '' } = {}) => '```' + lang + '\n' + code + '\n```',
      });
    </script>

    <!--
      Botão "Publicar" (envia para o GitHub).
      Só aparece quando o painel roda no seu computador (npm run dev).
      O "Salvar" do painel continua gravando só na pasta local.
    -->
    <style>
      #pub-botao { position: fixed; right: 20px; bottom: 20px; z-index: 9999; display: none; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #F5A524; color: #0D1117; font: 600 15px system-ui, sans-serif; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
      #pub-botao:hover { filter: brightness(1.05); }
      #pub-janela { width: min(560px, calc(100vw - 32px)); padding: 0; border: 1px solid #2A3240; border-radius: 12px; background: #11161D; color: #E6EDF3; font: 15px/1.5 system-ui, sans-serif; }
      #pub-janela::backdrop { background: rgba(0,0,0,.6); }
      #pub-janela .pub-corpo { display: flex; flex-direction: column; gap: 14px; padding: 22px; }
      #pub-janela h2 { margin: 0; font-size: 18px; }
      #pub-janela .pub-info { margin: 0; color: #9DA7B3; font-size: 14px; }
      #pub-janela ul { margin: 0; padding: 10px 14px; max-height: 220px; overflow: auto; list-style: none; background: #0B0F14; border: 1px solid #222A35; border-radius: 8px; font: 13px/1.8 ui-monospace, monospace; }
      #pub-janela .pub-estado { display: inline-block; width: 72px; color: #F5A524; }
      #pub-janela label { display: block; margin-bottom: 6px; font-size: 13px; color: #9DA7B3; }
      #pub-janela input { width: 100%; box-sizing: border-box; min-height: 42px; padding: 0 12px; border: 1px solid #2A3240; border-radius: 8px; background: #0B0F14; color: #E6EDF3; font: inherit; }
      #pub-janela .pub-acoes { display: flex; justify-content: flex-end; gap: 10px; }
      #pub-janela button { min-height: 42px; padding: 0 16px; border-radius: 8px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
      #pub-cancelar { border: 1px solid #2A3240; background: transparent; color: #9DA7B3; }
      #pub-confirmar { border: 0; background: #F5A524; color: #0D1117; }
      #pub-confirmar:disabled { opacity: .5; cursor: wait; }
      #pub-msg { margin: 0; font-size: 14px; white-space: pre-wrap; }
      #pub-msg:empty { display: none; }
      #pub-msg.erro { color: #FF7B72; }
      #pub-msg.ok { color: #3FB950; }
    </style>
    <script type="module">
      const estados = { M: 'alterado', A: 'novo', '??': 'novo', D: 'apagado', R: 'renomeado' };

      // Monta o botão e a janela de confirmação
      document.body.insertAdjacentHTML('beforeend', `
        <button id="pub-botao" type="button" title="Enviar as alterações salvas para o GitHub">⬆ Publicar</button>
        <dialog id="pub-janela" aria-labelledby="pub-titulo">
          <form method="dialog" class="pub-corpo">
            <h2 id="pub-titulo">Publicar no GitHub</h2>
            <p class="pub-info" id="pub-info"></p>
            <ul id="pub-lista"></ul>
            <div id="pub-campo">
              <label for="pub-mensagem">Descrição desta publicação</label>
              <input id="pub-mensagem" type="text" autocomplete="off">
            </div>
            <p id="pub-msg" role="status"></p>
            <div class="pub-acoes">
              <button id="pub-cancelar" value="cancelar">Fechar</button>
              <button id="pub-confirmar" type="button">Publicar</button>
            </div>
          </form>
        </dialog>`);

      const $ = (id) => document.getElementById(id);
      const botao = $('pub-botao'), janela = $('pub-janela'), lista = $('pub-lista');
      const info = $('pub-info'), msg = $('pub-msg'), confirmar = $('pub-confirmar');
      const campo = $('pub-campo'), mensagem = $('pub-mensagem');
      const escapar = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      const aviso = (texto, tipo = '') => { msg.textContent = texto; msg.className = tipo; };

      // Só mostra o botão se o servidor local responder (no site publicado ele não existe)
      fetch('/__publicar').then((r) => { if (r.ok) botao.style.display = 'flex'; }).catch(() => {});

      botao.addEventListener('click', async () => {
        aviso('');
        info.textContent = '';
        lista.innerHTML = '<li>Verificando alterações…</li>';
        confirmar.hidden = false; confirmar.disabled = false; campo.hidden = false;
        janela.showModal();
        try {
          const r = await fetch('/__publicar');
          const dados = await r.json();
          if (!r.ok) throw new Error(dados.erro);
          if (!dados.arquivos.length) {
            lista.innerHTML = '<li>Nada para publicar. Salve alguma alteração no painel primeiro.</li>';
            confirmar.hidden = true; campo.hidden = true;
            return;
          }
          info.textContent = `${dados.arquivos.length} arquivo(s) serão enviados para a branch "${dados.branch}":`;
          lista.innerHTML = dados.arquivos
            .map((a) => `<li><span class="pub-estado">${escapar(estados[a.estado] || a.estado)}</span>${escapar(a.caminho)}</li>`)
            .join('');
          const agora = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
          mensagem.value = `conteúdo: atualização do blog (${agora})`;
          mensagem.focus();
          mensagem.select();
        } catch (e) {
          lista.innerHTML = '';
          aviso('Erro ao verificar: ' + e.message, 'erro');
          confirmar.hidden = true; campo.hidden = true;
        }
      });

      confirmar.addEventListener('click', async () => {
        confirmar.disabled = true;
        aviso('Enviando para o GitHub…');
        try {
          const r = await fetch('/__publicar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mensagem: mensagem.value }),
          });
          const dados = await r.json();
          if (!r.ok) throw new Error(dados.erro);
          aviso(`Publicado! Commit ${dados.commit} enviado para "${dados.branch}".\nO Cloudflare atualiza o site em 1 a 2 minutos.`, 'ok');
          confirmar.hidden = true; campo.hidden = true;
        } catch (e) {
          aviso('Não foi possível publicar:\n' + e.message, 'erro');
          confirmar.disabled = false;
        }
      });
    </script>
  </head>
  <body></body>
</html>
